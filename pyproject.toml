[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "cweb-forge"
version = "0.1.0"
description = "Python SDK for cWeb Forge serverless data, for applications and notebooks"
readme = "README.md"
authors = [{name = "PyStrap"}]
keywords = ["cweb", "forge", "serverless", "database", "sdk", "notebooks"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<1"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
[project.urls]
Homepage = "https://cweb.app"
Documentation = "https://github.com/pystrap/cweb-forge-python#readme"
Source = "https://github.com/pystrap/cweb-forge-python"
Issues = "https://github.com/pystrap/cweb-forge-python/issues"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
cweb_forge = ["py.typed"]
